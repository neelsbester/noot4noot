name: Build and Push Player

on:
  push:
    branches: [ "main" ]
    paths:
      - 'player/**'
      - '.github/workflows/build-player.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'player/**'
      - '.github/workflows/build-player.yml'
  workflow_dispatch: # Allow manual trigger

env:
  IMAGE_NAME: neelsbester7/noot4noot

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only authenticate when pushing (not on PRs from forks)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./player
          # Only push on push to main, not on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          build-args: |
            VITE_SPOTIFY_CLIENT_ID=${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
